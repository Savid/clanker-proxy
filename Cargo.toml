[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/Savid/clanker-proxy"
publish = false

[workspace.dependencies]
base64 = "0.23"
cp-api = { path = "crates/cp-api" }
cp-core = { path = "crates/cp-core" }
cp-http = { path = "crates/cp-http" }
cp-sqlite = { path = "crates/cp-sqlite" }
cp-thread = { path = "crates/cp-thread" }
cpd = { path = "crates/cpd" }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
hmac = "0.13"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "server-graceful"] }
jiff = { version = "1", default-features = false, features = ["alloc", "serde"] }
js-sys = "0.3"
matchit = "0.9"
proptest = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.43", default-features = false, features = ["bundled", "cache"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.11"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
url = "2"
utoipa = "6"
wasm-bindgen = "0.2"
worker = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A panic in the Worker hangs the request and resets the Durable Object, so
# library code reports errors instead.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The Worker ships as WebAssembly; size drives cold-start time.
[profile.release.package.cpd-worker]
opt-level = "s"
