[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/Savid/clanker-proxy"
publish = false

[workspace.dependencies]
cp-api = { path = "crates/cp-api" }
cp-thread = { path = "crates/cp-thread" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
jiff = { version = "1", default-features = false, features = ["alloc", "serde"] }
js-sys = "0.3"
proptest = "1"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "2"
url = "2"
utoipa = "6"
wasm-bindgen = "0.2"
worker = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A panic in the Worker hangs the request and resets the Durable Object, so
# library code reports errors instead.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The Worker ships as WebAssembly; size drives cold-start time.
[profile.release.package.cpd-worker]
opt-level = "s"
