# Spec lint (make lint-api): vacuum's recommended OpenAPI rules and the
# OWASP API security rules over api/openapi.json, which cp-api generates.
# Rules turned off, and why:
extends:
  - [vacuum:oas, recommended]
  - [vacuum:owasp, all]
rules:
  # Examples belong where they teach something; the shared schemas carry
  # them.
  oas3-missing-example: off
  # Shared path parameters (a peer's name, a thread ref) are described the
  # same way wherever they appear, on purpose.
  description-duplication: off
  # Every operation's errors are its `default` RFC 9457 Problem, and
  # descriptions name the statuses that matter; listing 400, 401, 422, 429
  # and 500 per operation would repeat the same Problem everywhere.
  owasp-define-error-responses-401: off
  owasp-define-error-responses-429: off
  owasp-define-error-responses-500: off
  owasp-define-error-validation: off
  # No quota headers: the one public write is limited by count, not quota.
  owasp-rate-limit: off
  # Inputs use bounded, patterned types. What remains is free text the
  # daemon writes (error details, versions), which has nothing to match.
  owasp-string-restricted: off
  # Each owner hosts their own daemon behind their own TLS, so the spec's
  # server is relative; daemons and cpctl refuse plain http to anything
  # but loopback.
  owasp-security-hosts-https-oas3: off
  # Health is public for uptime checks, and peering requests are public on
  # purpose: they are how a stranger asks to connect. Requests are capped,
  # expire, and grant nothing until the owner approves and the requester's
  # daemon proves its URL.
  owasp-protection-global-safe: off
  owasp-protection-global-unsafe: off
  owasp-protection-global-unsafe-strict: off
