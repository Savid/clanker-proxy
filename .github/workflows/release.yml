name: Release

# A stable version tag publishes the archives, checksums, installer and the
# container image. A pull request that touches the release path runs
# everything but publishing, so it is tested before a tag needs it.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .dockerignore
      - Dockerfile
      - scripts/package.sh
      - scripts/release_smoke.sh
      - scripts/worker_bundle.sh
      - scripts/cloudflare.sh
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/savid/clanker-proxy
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - id: version
        name: The tag is stable and matches the workspace version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "cpd") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = true ]; then
            [[ "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::$REF_NAME is not a stable version tag"; exit 1; }
            [ "$REF_NAME" = "v$version" ] || { echo "::error::tag $REF_NAME does not match the workspace version $version"; exit 1; }
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.PUBLISH == 'true'
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        if: env.PUBLISH == 'true'
        with:
          tool: cargo-nextest,cargo-deny
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.PUBLISH == 'true'
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - if: env.PUBLISH == 'true'
        run: npm ci --no-audit --no-fund && make lint test

  build:
    needs: check
    strategy:
      matrix:
        include:
          - { os: linux, arch: amd64, target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, smoke: true }
          - { os: linux, arch: arm64, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, smoke: true }
          - { os: darwin, arch: amd64, target: x86_64-apple-darwin, runner: macos-15, smoke: false }
          - { os: darwin, arch: arm64, target: aarch64-apple-darwin, runner: macos-15, smoke: true }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      # Static Linux binaries: ring and SQLite compile their C against musl.
      - if: matrix.os == 'linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: sh scripts/package.sh ${{ matrix.target }} ${{ matrix.os }} ${{ matrix.arch }}
      - if: matrix.smoke
        run: sh scripts/release_smoke.sh build/dist/clanker-proxy_${{ matrix.os }}_${{ matrix.arch }}.tar.gz v${{ needs.check.outputs.version }}
      - if: matrix.os == 'linux'
        run: file build/dist/${{ matrix.os }}-${{ matrix.arch }}/cpd | grep -q 'static'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: build/dist/
          if-no-files-found: error

  worker:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: worker
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: cargo install worker-build --version 0.9.0 --locked
      - run: make worker-build && sh scripts/worker_bundle.sh
      - name: The bundle deploys with Node alone
        run: |
          d=$(mktemp -d)
          tar -xzf build/dist/clanker-proxy_worker.tar.gz -C "$d"
          cd "$d" && npm ci --no-audit --no-fund && npx wrangler deploy --dry-run --outdir out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-worker
          path: build/dist/clanker-proxy_worker.tar.gz
          if-no-files-found: error

  image:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-linux-*
          path: build/dist
          merge-multiple: true
      - id: tags
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: echo "tags=$IMAGE:$VERSION,$IMAGE:${VERSION%.*},$IMAGE:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=clanker-proxy daemon (cpd) and CLI (cpctl)
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
      - if: env.PUBLISH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [build, image, worker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: build/dist
          merge-multiple: true
      - name: Assemble the release
        run: |
          mkdir release
          cp build/dist/*.tar.gz scripts/install.sh scripts/cloudflare.sh release/
          (cd release && sha256sum -- *.tar.gz install.sh cloudflare.sh > checksums.txt)
          cat release/checksums.txt
          set -- release/*.tar.gz
          [ "$#" -eq 5 ] || { echo "::error::expected 4 archives and the Worker bundle, got $#"; exit 1; }
      - if: env.PUBLISH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/checksums.txt
      # Uploads go to a draft and publishing comes last, so nobody sees a
      # partial release; this also works with immutable releases.
      - if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes release/*
          fi
          gh release edit "$TAG" --draft=false
