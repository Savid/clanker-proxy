version: 2
project_name: clanker-proxy
dist: build/dist

env:
  - GOWORK=off
  - CGO_ENABLED=0

builds:
  - id: cpd
    main: ./cmd/cpd
    binary: cpd
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ['-s -w -X main.version=v{{ .Version }}']
  - id: cpctl
    main: ./cmd/cpctl
    binary: cpctl
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ['-s -w -X main.version=v{{ .Version }}']

archives:
  - ids: [cpd, cpctl]
    name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: scripts/install.sh

release:
  draft: true
  replace_existing_draft: true
  extra_files:
    - glob: scripts/install.sh
  preflight:
    fail_on_error: true

changelog:
  use: github-native
