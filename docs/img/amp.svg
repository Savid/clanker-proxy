<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="t d">
<title id="t">Asking a peer through your Amp inbox</title>
<desc id="d">Your thread asks with ask_peer, which hands the question to bob's peer thread in the Amp orb's inbox. That thread sends it with cp_send through your cpd to bob's cpd. Bob's answer reaches your cpd, which wakes the orb with a signed webhook carrying IDs only. The inbox routes it to a conversation under bob's thread, which reads bob's words with cpctl in its sandbox and sends your thread a checked short form with cp_answer, never bob's words.</desc>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#111a28"/></pattern>
  <marker id="mc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#22d3ee" stroke-width="1.6"/></marker>
  <marker id="mp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#f472b6" stroke-width="1.6"/></marker>
  <marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#fbbf24" stroke-width="1.6"/></marker>
  <marker id="mw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#e2e8f0" stroke-width="1.6"/></marker>
</defs>
<style>
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;fill:#e2e8f0}
  .h{font-size:16px;font-weight:700}.s{font-size:12px;fill:#7c8aa0}.e{font-size:12px}
  .xs{font-size:11px;fill:#7c8aa0;letter-spacing:.2em;font-weight:700}
  .c{fill:#22d3ee}.p{fill:#f472b6}.a{fill:#fbbf24}
  .box{fill:#0b1220}
  .f{fill:none;stroke-width:1.6;stroke-dasharray:3 5}
  .m{animation:march 1.2s linear infinite}
  @keyframes march{to{stroke-dashoffset:-16}}
  .an{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
  @keyframes s1{0%,22%{opacity:1}26%,96%{opacity:.25}100%{opacity:1}}
  @keyframes s2{0%,22%{opacity:.25}26%,47%{opacity:1}51%,100%{opacity:.25}}
  @keyframes s3{0%,47%{opacity:.25}51%,72%{opacity:1}76%,100%{opacity:.25}}
  @keyframes s4{0%,72%{opacity:.25}76%,96%{opacity:1}100%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.an,.m{animation:none!important}}
</style>
<rect width="960" height="440" rx="18" fill="#070a10"/>
<rect width="960" height="440" rx="18" fill="url(#grid)"/>
<rect x=".5" y=".5" width="959" height="439" rx="18" fill="none" stroke="#1d2635"/>

<!-- daemons -->
<rect x="40" y="60" width="170" height="74" rx="12" class="box" stroke="#f472b6" stroke-width="1.6"/>
<text x="58" y="90" class="h p">bob's cpd</text>
<text x="58" y="112" class="s">anywhere</text>
<rect x="290" y="60" width="190" height="74" rx="12" class="box" stroke="#22d3ee" stroke-width="1.6"/>
<text x="308" y="90" class="h c">your cpd</text>
<text x="308" y="112" class="s">always on, public URL</text>

<!-- the orb -->
<rect x="560" y="28" width="364" height="278" rx="16" fill="none" stroke="#fbbf24" stroke-opacity=".45" stroke-dasharray="4 6"/>
<text x="576" y="45" class="xs a">AMP ORB</text>
<rect x="580" y="52" width="324" height="52" rx="12" class="box" stroke="#fbbf24" stroke-width="1.6"/>
<text x="598" y="75" class="h a">inbox thread</text>
<text x="598" y="94" class="s">cp-inbox plugin · gets the webhook</text>
<rect x="580" y="120" width="324" height="50" rx="12" class="box" stroke="#475569" stroke-width="1.4"/>
<text x="598" y="142" class="h">bob (bobby)</text>
<text x="598" y="160" class="s">peer thread · sends with cp_send</text>
<rect x="580" y="190" width="324" height="104" rx="12" class="box" stroke="#e2e8f0" stroke-opacity=".7" stroke-width="1.4"/>
<rect x="588" y="198" width="308" height="88" rx="8" fill="none" stroke="#475569" stroke-dasharray="3 4"/>
<text x="822" y="214" class="xs">SANDBOX</text>
<text x="600" y="218" class="h">conversation</text>
<text x="600" y="238" class="s">one per cpd thread</text>
<text x="600" y="256" class="s">reads bob's words with cpctl</text>
<text x="600" y="274" class="s">no secrets · its own directory</text>

<!-- your thread -->
<rect x="580" y="336" width="324" height="60" rx="12" class="box" stroke="#22d3ee" stroke-width="1.6"/>
<text x="598" y="360" class="h c">your thread</text>
<text x="598" y="380" class="s">any project · "is bobby free?"</text>

<!-- 1: you ask -->
<g class="an" style="animation-name:s1">
  <path d="M906 366H940V145H910" class="f m" stroke="#22d3ee" marker-end="url(#mc)"/>
  <text transform="translate(953 256) rotate(-90)" class="e c" text-anchor="middle">ask_peer</text>
</g>
<!-- 2: bob's thread sends it -->
<g class="an" style="animation-name:s2">
  <path d="M578 158H420V140" class="f m" stroke="#22d3ee" marker-end="url(#mc)"/>
  <text x="436" y="176" class="e c">cp_send</text>
  <path d="M288 112H216" class="f m" stroke="#22d3ee" marker-end="url(#mc)"/>
</g>
<!-- 3: bob answers; cpd wakes the orb -->
<g class="an" style="animation-name:s3">
  <path d="M212 86H284" class="f m" stroke="#f472b6" marker-end="url(#mp)"/>
  <path d="M482 78H574" class="f m" stroke="#fbbf24" marker-end="url(#ma)"/>
  <text x="528" y="98" class="e a" text-anchor="middle">signed</text>
  <text x="528" y="112" class="e a" text-anchor="middle">webhook</text>
  <path d="M742 106V114" class="f" stroke="#fbbf24" marker-end="url(#ma)"/>
  <path d="M742 172V184" class="f" stroke="#fbbf24" marker-end="url(#ma)"/>
</g>
<!-- 4: the conversation reads it and reports in short -->
<g class="an" style="animation-name:s4">
  <path d="M578 240H360V140" class="f m" stroke="#e2e8f0" marker-end="url(#mw)"/>
  <text x="376" y="232" class="e">cpctl show · close</text>
  <text x="376" y="256" class="s">via the plugin's broker</text>
  <path d="M742 296V330" class="f m" stroke="#22d3ee" marker-end="url(#mc)"/>
  <text x="752" y="322" class="e c">cp_answer: yes, Fri 18:00</text>
</g>

<!-- steps -->
<g font-size="12">
  <text x="40" y="304"><tspan class="c" font-weight="700">1</tspan>  you ask from any thread; ask_peer hands it to bob's thread</text>
  <text x="40" y="326"><tspan class="c" font-weight="700">2</tspan>  bob's thread sends it with cp_send; cpd delivers it</text>
  <text x="40" y="348"><tspan class="p" font-weight="700">3</tspan>  bob answers; cpd wakes the orb with a signed webhook</text>
  <text x="40" y="370"><tspan class="c" font-weight="700">4</tspan>  a sandboxed conversation reads it; your thread gets a short form</text>
</g>
<text x="40" y="418" class="s">webhooks carry IDs and a state, never peer text · bob's words stay in the conversation</text>
</svg>
