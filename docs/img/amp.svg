<svg xmlns="http://www.w3.org/2000/svg" width="960" height="486" viewBox="0 0 960 486" role="img" aria-labelledby="t d">
<title id="t">Your threads and the Amp inbox</title>
<desc id="d">Your threads hold your credentials and full tools. Between them and the inbox project is one-way glass: asks, messages and follow-ups go in; out come only the plugin's own words, a notice and a checked short form, plus a button only you see. Bob's words and a conversation's ID never come out. In the inbox's Amp orb, the inbox owns the webhook and stays idle, the inbox's plugin sends your asks, bob's peer thread lists his conversations and runs nothing, and a conversation reads bob's words in a sandbox with a key for its own cpd thread. The inbox sends through your cpd, your cpd wakes the inbox with a signed webhook, and the conversation reaches your cpd with cpctl. Your cpd and bob's cpd exchange the threads.</desc>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#111a28"/></pattern>
  <marker id="mc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#22d3ee" stroke-width="1.6"/></marker>
  <marker id="mp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#f472b6" stroke-width="1.6"/></marker>
  <marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#fbbf24" stroke-width="1.6"/></marker>
  <marker id="mw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#e2e8f0" stroke-width="1.6"/></marker>
</defs>
<style>
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;fill:#e2e8f0}
  .h{font-size:16px;font-weight:700}.s{font-size:12px;fill:#7c8aa0}.e{font-size:12px}
  .xs{font-size:11px;fill:#7c8aa0;letter-spacing:.2em;font-weight:700}
  .c{fill:#22d3ee}.p{fill:#f472b6}.a{fill:#fbbf24}
  .box{fill:#0b1220}
  .f{fill:none;stroke-width:1.6;stroke-dasharray:3 5}
  .m{animation:march 1.2s linear infinite}
  @keyframes march{to{stroke-dashoffset:-16}}
  .pk{opacity:0;animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
  @keyframes p1{0%{opacity:0;transform:translateX(0)}2%{opacity:1}12%{opacity:1;transform:translateX(166px)}14%,100%{opacity:0;transform:translateX(166px)}}
  @keyframes p2{0%,13%{opacity:0;transform:translateX(0)}15%{opacity:1}22%{opacity:1;transform:translateX(54px)}24%,100%{opacity:0;transform:translateX(54px)}}
  @keyframes p3{0%,23%{opacity:0;transform:translateY(0)}25%{opacity:1}33%{opacity:1;transform:translateY(82px)}35%,100%{opacity:0;transform:translateY(82px)}}
  @keyframes p4{0%,37%{opacity:0;transform:translateY(0)}39%{opacity:1}47%{opacity:1;transform:translateY(-82px)}49%,100%{opacity:0;transform:translateY(-82px)}}
  @keyframes p5{0%,49%{opacity:0;transform:translateX(0)}51%{opacity:1}57%{opacity:1;transform:translateX(-56px)}59%,100%{opacity:0;transform:translateX(-56px)}}
  @keyframes p6{0%,61%{opacity:0;transform:translateX(0)}63%{opacity:1}71%{opacity:1;transform:translateX(-76px)}73%,100%{opacity:0;transform:translateX(-76px)}}
  @keyframes p7{0%,79%{opacity:0;transform:translateX(0)}81%{opacity:1}93%{opacity:1;transform:translateX(-148px)}95%,100%{opacity:0;transform:translateX(-148px)}}
  @keyframes rd{0%,57%{stroke-opacity:.7}60%,64%{stroke-opacity:1;stroke:#f472b6}68%,100%{stroke-opacity:.7}}
  @keyframes no{0%,71%{opacity:.55}73%,77%{opacity:1}81%,100%{opacity:.55}}
  .rd{animation:rd 10s ease-in-out infinite}.no{animation:no 10s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.m,.pk,.rd,.no{animation:none!important}}
</style>
<rect width="960" height="486" rx="18" fill="#070a10"/>
<rect width="960" height="486" rx="18" fill="url(#grid)"/>
<rect x=".5" y=".5" width="959" height="485" rx="18" fill="none" stroke="#1d2635"/>

<!-- your threads -->
<rect x="24" y="36" width="200" height="336" rx="16" fill="none" stroke="#22d3ee" stroke-opacity=".45" stroke-dasharray="4 6"/>
<text x="40" y="58" class="xs c">YOUR THREADS</text>
<rect x="36" y="136" width="176" height="82" rx="12" class="box" stroke="#22d3ee" stroke-width="1.6"/>
<text x="50" y="162" class="h c">your thread</text>
<text x="50" y="184" class="s">credentials · tools</text>
<text x="50" y="204" class="s">ask_peer</text>
<rect x="36" y="246" width="176" height="82" rx="12" class="box" stroke="#22d3ee" stroke-opacity=".6" stroke-width="1.4"/>
<text x="50" y="272" class="h c">a Space</text>
<text x="50" y="292" class="s">no plugins</text>
<text x="50" y="312" class="s">no ask_peer</text>
<text x="40" y="96" class="s">never sees bob's words</text>

<!-- the one-way glass -->
<text x="300" y="26" class="xs" text-anchor="middle">ONE-WAY GLASS</text>
<path d="M298 36V372M302 36V372" stroke="#94a3b8" stroke-opacity=".5"/>

<!-- inbox project -->
<rect x="360" y="36" width="292" height="336" rx="16" fill="none" stroke="#fbbf24" stroke-opacity=".45" stroke-dasharray="4 6"/>
<text x="376" y="54" class="xs a">INBOX PROJECT · AMP ORB</text>
<rect x="380" y="66" width="252" height="58" rx="12" class="box" stroke="#fbbf24" stroke-width="1.6"/>
<text x="396" y="90" class="h a">inbox</text>
<text x="396" y="110" class="s">owns the webhook · sends asks</text>
<rect x="380" y="146" width="252" height="60" rx="12" class="box" stroke="#475569" stroke-width="1.4"/>
<text x="396" y="170" class="h">bob (bobby)</text>
<text x="396" y="192" class="s">lists bob · runs nothing</text>
<rect x="380" y="226" width="252" height="134" rx="10" fill="none" stroke="#475569" stroke-dasharray="3 4"/>
<text x="560" y="244" class="xs">SANDBOX</text>
<rect x="392" y="252" width="228" height="96" rx="10" class="box rd" stroke="#e2e8f0" stroke-opacity=".7" stroke-width="1.4"/>
<text x="406" y="276" class="h">conversation</text>
<text x="406" y="296" class="s">reads bob's words</text>
<text x="406" y="316" class="s">key for one cpd thread</text>
<text x="406" y="336" class="s">cp_answer: short form</text>

<!-- daemons -->
<rect x="700" y="96" width="236" height="100" rx="12" class="box" stroke="#22d3ee" stroke-width="1.6"/>
<text x="716" y="124" class="h c">your cpd</text>
<text x="716" y="146" class="s">always on</text>
<text x="716" y="166" class="s">public URL</text>
<rect x="700" y="290" width="236" height="66" rx="12" class="box" stroke="#f472b6" stroke-width="1.6"/>
<text x="716" y="318" class="h p">bob's cpd</text>
<text x="716" y="340" class="s">bob's daemon</text>

<!-- in, out, never -->
<path d="M214 166H382" class="f m" stroke="#22d3ee" marker-end="url(#mc)"/>
<text x="236" y="158" class="e c">in</text>
<path d="M366 196H216" class="f m" stroke="#fbbf24" marker-end="url(#ma)"/>
<text x="236" y="214" class="e a">out</text>
<path d="M388 300H308" class="f" stroke="#f472b6"/>
<text x="300" y="307" class="p no" font-size="20" font-weight="700" text-anchor="middle">✕</text>

<!-- orb and daemons -->
<path d="M698 104H638" class="f m" stroke="#fbbf24" marker-end="url(#ma)"/>
<text x="642" y="98" class="e a">webhook</text>
<path d="M634 116H696" class="f m" stroke="#22d3ee" marker-end="url(#mc)"/>
<text x="640" y="134" class="e c">sends</text>
<path d="M622 268H724V200" class="f m" stroke="#e2e8f0" marker-end="url(#mw)"/>
<text x="640" y="262" class="e">cpctl</text>
<path d="M840 198V286" class="f m" stroke="#22d3ee" marker-end="url(#mc)"/>
<path d="M880 288V200" class="f m" stroke="#f472b6" marker-end="url(#mp)"/>
<text x="744" y="248" class="s">threads</text>

<!-- packets -->
<circle cx="214" cy="166" r="4" class="pk" fill="#22d3ee" style="animation-name:p1"/>
<circle cx="636" cy="172" r="4" class="pk" fill="#22d3ee" style="animation-name:p2"/>
<circle cx="840" cy="200" r="4" class="pk" fill="#22d3ee" style="animation-name:p3"/>
<circle cx="880" cy="286" r="4" class="pk" fill="#f472b6" style="animation-name:p4"/>
<circle cx="696" cy="104" r="4" class="pk" fill="#fbbf24" style="animation-name:p5"/>
<circle cx="386" cy="300" r="4" class="pk" fill="#f472b6" style="animation-name:p6"/>
<circle cx="366" cy="196" r="4" class="pk" fill="#fbbf24" style="animation-name:p7"/>

<!-- legend -->
<g font-size="12">
  <text x="40" y="406"><tspan class="c" font-weight="700">in </tspan>  asks, messages, follow-ups: you instructing</text>
  <text x="40" y="428"><tspan class="a" font-weight="700">out</tspan>  only the plugin's words: a notice, the short form, a button only you see</text>
  <text x="40" y="450"><tspan class="p" font-weight="700">✕  </tspan>  never out: bob's words, a conversation's ID</text>
</g>
<text x="40" y="474" class="s">conversations read peers but hold no credentials · your threads hold credentials but never read peers</text>
</svg>
