<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="t d">
<title id="t">clanker-proxy</title>
<desc id="d">Two clanker robots, one cyan and one magenta, talk through a tin-can telephone. A question card travels along the string to the other robot and a checked answer card comes back, past a padlock that seals the line. Under them, the wordmark clanker-proxy and the line: have your agent call my agent.</desc>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#111a28" stroke-width="1"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="vig" cx="50%" cy="38%" r="60%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".07"/><stop offset=".55" stop-color="#f472b6" stop-opacity=".03"/><stop offset="1" stop-color="#070a10" stop-opacity="0"/></radialGradient>
</defs>
<style>
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
  .wm{fill:#e2e8f0}.hy{fill:#fbbf24}
  .tag{font-size:18px;fill:#7c8aa0;letter-spacing:.02em}.c{fill:#22d3ee}.p{fill:#f472b6}
  .an{animation-duration:7s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
  .string{stroke-dasharray:5 7;animation:flow 1.4s linear infinite}
  .q{animation-name:q}.k{animation-name:k}.talk{animation-name:talk}
  .lock{animation-name:lock;transform-origin:480px 154px}
  .me .ant{animation-name:antl}.you .ant{animation-name:antr}
  .eyes{animation-name:blink;animation-duration:4.6s}.you .eyes{animation-delay:-2.1s}
  .hy{animation:hum 3.5s ease-in-out infinite}
  @keyframes flow{to{stroke-dashoffset:-24}}
  @keyframes q{0%{opacity:0;transform:translate(347px,109px)}4%{opacity:1;transform:translate(347px,109px)}14%{transform:translate(406px,121px)}22%{transform:translate(480px,126px)}30%{transform:translate(554px,121px)}38%{opacity:1;transform:translate(613px,109px)}42%,100%{opacity:0;transform:translate(613px,109px)}}
  @keyframes k{0%,50%{opacity:0;transform:translate(613px,109px)}54%{opacity:1;transform:translate(613px,109px)}64%{transform:translate(554px,121px)}72%{transform:translate(480px,126px)}80%{transform:translate(406px,121px)}88%{opacity:1;transform:translate(347px,109px)}92%,100%{opacity:0;transform:translate(347px,109px)}}
  @keyframes lock{0%,18%,26%,68%,76%,100%{transform:scale(1)}22%,72%{transform:scale(1.18)}}
  @keyframes antl{0%,8%,86%,94%{opacity:1}4%,90%{opacity:.25}10%,84%,96%,100%{opacity:1}}
  @keyframes antr{0%,36%,46%,100%{opacity:1}40%,52%{opacity:.25}56%{opacity:1}}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  @keyframes talk{0%,12%,84%,100%{transform:scaleY(1)}3%,9%,87%{transform:scaleY(.35)}6%,90%{transform:scaleY(1.2)}}
  @keyframes hum{0%,100%{opacity:1}50%{opacity:.55}}
  @media (prefers-reduced-motion:reduce){.an,.string,.hy,.eyes,.talk{animation:none!important}}
</style>
